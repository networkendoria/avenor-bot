name: Sunucu Baglanti Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install mineflayer
      - name: Sunucuya gir ve TAB listesini yazdir
        env:
          MC_SERVER: ${{ secrets.MC_SERVER }}
          MC_BOT_PASSWORD: ${{ secrets.MC_BOT_PASSWORD }}
        run: node tab_test.js
