name: Yetkili Log

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: yetkili-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baslangic durumunu yedekle
        run: |
          cp state.json /tmp/state_base.json
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
      - name: Botu calistir
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          POLL_SECONDS: "60"
          RUN_MINUTES: "28"
        run: python bot.py
      - name: Sureleri cakismasiz kaydet
        if: always()
        run: |
          set -e
          git config user.name "avenor-bot"
          git config user.email "bot@users.noreply.github.com"
          cp state.json /tmp/state_local.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git show origin/main:state.json > /tmp/state_remote.json
            python merge_state.py /tmp/state_base.json /tmp/state_local.json /tmp/state_remote.json state.json
            git add state.json
            if git diff --cached --quiet; then
              echo "Kaydedilecek yeni durum yok."
              exit 0
            fi
            git commit -m "state guncelle"
            if git push origin HEAD:main; then
              echo "Aktiflik durumu kaydedildi."
              exit 0
            fi
            echo "Push cakismasi, guncel durumla tekrar birlestirilecek ($attempt/5)."
            git reset --hard origin/main
          done
          echo "Durum 5 denemede kaydedilemedi." >&2
          exit 1
      - name: Sonraki calismayi baslat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Calisma suresi: ${ELAPSED}s"
          if [ "$ELAPSED" -ge 1200 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/yetkili-log.yml/dispatches" -f ref=main
          else
            echo "Calisma erken bitti; zamanlayici yedek olarak devrede."
          fi
