name: Yetkili Log

on:
  schedule:
    - cron: "*/30 * * * *"   # yedek: zincir kopmussa yeniden baslatir
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Ayni anda iki calisma olmasin; yenisi siraya girsin
concurrency:
  group: yetkili-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baslangic zamanini kaydet
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
      # Her calisma ~28 dakika boyunca dakikada bir siteye bakar, sonunda mesaj atar
      - name: Botu calistir
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          POLL_SECONDS: "60"
          RUN_MINUTES: "28"
        run: python bot.py
      - name: Sureleri kaydet
        if: always()
        run: |
          git config user.name "avenor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state guncelle" && git pull --rebase origin main && git push)
      # GitHub'in zamanlayicisi guvenilir olmadigi icin her calisma bir sonrakini kendisi baslatir.
      # Bot hemen coktuyse (20 dakikadan kisa surduyse) sonsuz dongu olmasin diye baslatmaz.
      - name: Sonraki calismayi baslat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Calisma suresi: ${ELAPSED}s"
          if [ "$ELAPSED" -ge 1200 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/yetkili-log.yml/dispatches" -f ref=main
          else
            echo "Calisma erken bitti, zincir baslatilmadi (yedek zamanlayici devralir)."
          fi
