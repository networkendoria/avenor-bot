name: Yetkili Log

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ayni anda iki calisma olmasin; yenisi siraya girsin
concurrency:
  group: yetkili-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Her calisma ~28 dakika boyunca dakikada bir siteye bakar, sonunda mesaj atar
      - name: Botu calistir
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          POLL_SECONDS: "60"
          RUN_MINUTES: "28"
        run: python bot.py
      - name: Sureleri kaydet
        if: always()
        run: |
          git config user.name "avenor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state guncelle" && git pull --rebase origin main && git push)
